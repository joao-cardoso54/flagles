<meta charset="utf-8">

<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; --card:#fff; --acc:#2563eb; --acc-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --fg:#f5f5f4; --mut:#a8a29e; --line:#2a2826; --card:#1c1b19; --acc:#60a5fa; --acc-fg:#0c0a09; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { position:sticky; top:0; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; z-index:2; }
  h1 { font-size:18px; margin:0 0 4px; font-weight:650; }
  .legend { color:var(--mut); font-size:13px; margin:0 0 10px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip, .btn { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .chip.on { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
  input[type=search] { flex:1 1 140px; min-width:120px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; }
  main { max-width:760px; margin:0 auto; padding:8px 16px 80px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .n { width:28px; color:var(--mut); font-size:13px; text-align:right; flex:none; }
  .t { flex:1; min-width:0; }
  .t small { color:var(--mut); margin-left:6px; }
  .opts { display:flex; gap:4px; flex:none; }
  .opts button { width:36px; height:36px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:10px; font:inherit; font-size:15px; cursor:pointer; }
  .opts button.on { background:var(--acc); color:var(--acc-fg); border-color:var(--acc); }
  .opts button.x.on { background:#b91c1c; border-color:#b91c1c; color:#fff; }
  .status { color:var(--mut); font-size:13px; margin-left:auto; }
  @media (max-width:480px) { .row { flex-wrap:wrap; } .t { flex-basis:calc(100% - 40px); } .opts { margin-left:40px; } }
</style>
</head>

  </div>
</header>

const KEY = "flagles-song-tiers-v1";
let tiers = {};
try { tiers = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let filter = "all", query = "";

const list = document.getElementById("list");
const status = document.getElementById("status");

function save() { try { localStorage.setItem(KEY, JSON.stringify(tiers)); } catch (e) {} }
function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }

function render() {
  list.innerHTML = "";
  let shown = 0;
  SONGS.forEach(([title, id, easy, artist, group, note], i) => {
    const v = tiers[title];
    if (filter === "none" && v) return;
    if (["1","2","3","4","x"].includes(filter) && String(v) !== filter) return;
    if (filter === "beatles" && group !== "beatles") return;
    if (filter === "solo" && group !== "solo") return;
    if (query && !norm(title).includes(norm(query))) return;
    shown++;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="n">${i + 1}</span><span class="t">${title}${artist ? `<small>${artist}</small>` : ""}${easy ? "<small>easy no revolution1</small>" : ""}${id ? "" : "<small>sem ID</small>"}${note ? `<small>${note}</small>` : ""}</span>`;
    const opts = document.createElement("div");
    opts.className = "opts";
    ["1","2","3","4","x"].forEach(o => {
      const b = document.createElement("button");
      b.textContent = o === "x" ? "✕" : o;
      if (o === "x") b.classList.add("x");
      if (String(v) === o) b.classList.add("on");
      b.onclick = () => { if (String(tiers[title]) === o) delete tiers[title]; else tiers[title] = o; save(); render(); };
      opts.appendChild(b);
    });
    row.appendChild(opts);
    list.appendChild(row);
  });
  const done = SONGS.filter(s => tiers[s[0]]).length;
  status.textContent = `${done}/${SONGS.length} classificadas · ${shown} visíveis`;
}

document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); filter = c.dataset.f; render();
});
document.getElementById("q").oninput = e => { query = e.target.value; render(); };
document.getElementById("copy").onclick = async () => {
  const out = SONGS.map(([title, id, , artist, group]) => ({ title, artist, group, videoId: id, tier: tiers[title] || null }));
  const text = JSON.stringify(out, null, 2);
  try { await navigator.clipboard.writeText(text); status.textContent = "JSON copiado"; }
  catch (e) { window.prompt("Copia o JSON:", text); }
};
render();
</script>
