<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9">
  <title>Flagles</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <!-- Menu -->
    <section id="home" class="screen">
      <h1 class="logo">Flagles</h1>
      <p class="tagline">Bandeiras e Beatles</p>

      <div class="field">
        <span class="field-label">Jogar com</span>
        <div class="seg" id="content" role="group" aria-label="Conteúdo">
          <button type="button" data-v="songs">Beatles</button>
          <button type="button" data-v="flags">Bandeiras</button>
          <button type="button" data-v="both">Os dois</button>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Responder</span>
        <div class="answer-row" id="row-song">
          <span>Música</span>
          <div class="seg small" id="mode-song" role="group" aria-label="Resposta da música">
            <button type="button" data-v="options">Opções</button>
            <button type="button" data-v="typing">Escrever</button>
          </div>
        </div>
        <div class="answer-row" id="row-flag">
          <span>Bandeira</span>
          <div class="seg small" id="mode-flag" role="group" aria-label="Resposta da bandeira">
            <button type="button" data-v="options">Opções</button>
            <button type="button" data-v="typing">Escrever</button>
          </div>
        </div>
      </div>

      <details class="more">
        <summary>Mais opções</summary>
        <label class="check" id="row-solo"><input type="checkbox" id="opt-solo"> Incluir carreiras a solo (Lennon, McCartney, Harrison, Ringo)</label>
        <label class="check" id="row-terr"><input type="checkbox" id="opt-terr"> Incluir territórios (Anguila, Guam, ...) e UE, ONU, Antártida</label>
        <label class="check" id="row-states"><input type="checkbox" id="opt-states"> Incluir estados dos EUA</label>
      </details>

      <!-- passo 5b: <button id="play" class="btn primary" disabled>A carregar…</button> -->
      <button id="play-levels" class="btn primary" disabled>A carregar…</button>
      <button id="play" class="btn" disabled>Treino livre</button>
      <p class="hint" id="record"></p>
    </section>

    <!-- Escolha de nível -->
    <section id="levels" class="screen" hidden>
      <div class="topbar">
        <button id="levels-back" class="link" type="button">‹ Menu</button>
        <span class="label" id="levels-total"></span>
      </div>
      <h2 class="title">Níveis</h2>
      <div class="level-grid" id="level-grid"></div>
    </section>

    <!-- Resultado de um nível -->
    <section id="result-screen" class="screen" hidden>
      <h2 class="title" id="res-title"></h2>
      <p class="big" id="res-score"></p>
      <p class="hint" id="res-detail"></p>
      <button id="res-next" class="btn primary">Próximo nível</button>
      <button id="res-retry" class="btn">Tentar de novo</button>
      <button id="res-levels" class="btn">Níveis</button>
    </section>

    <!-- Jogo (provisório até ao passo 7: sem vidas, relógio nem níveis) -->
    <section id="game" class="screen" hidden>
      <div class="topbar">
        <button id="menu-btn" class="link" type="button">‹ Menu</button>
        <span class="label" id="score">Certas: 0 / 0</span>
      </div>
      <div class="hud" id="hud" hidden>
        <span id="hud-level"></span>
        <span class="lives" id="lives" aria-label="Vidas"></span>
      </div>
      <div class="timer" id="timer" hidden><div id="timer-bar"></div><span id="timer-text"></span></div>

      <div class="q q-song" id="q-song">
        <p class="hint" id="status">&nbsp;</p>
        <div class="steps" id="steps"></div>
        <button id="listen" class="btn primary">Ouvir 1s</button>
        <button id="advance" class="btn">Avançar</button>
        <div class="options" id="options"></div>
        <form id="song-form" class="typebox" hidden>
          <input id="song-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Nome da música">
          <button class="btn primary" type="submit">Verificar</button>
        </form>
        <p class="result" id="result" aria-live="polite"></p>
      </div>

      <div class="q q-flag" id="q-flag">
        <img id="flag-img" class="flag" alt="Bandeira a adivinhar" width="320" height="213">
        <div class="options" id="flag-options"></div>
        <form id="flag-form" class="typebox" hidden>
          <input id="flag-input" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Nome do país">
          <button class="btn primary" type="submit">Verificar</button>
        </form>
        <p class="result" id="flag-result" aria-live="polite"></p>
      </div>

      <button id="next" class="btn" hidden>Seguinte</button>
    </section>
  </main>

  <!-- Player do YouTube: quase invisível, mas presente (alguns browsers não tocam se estiver display:none) -->
  <div class="yt-host"><div id="yt"></div></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
